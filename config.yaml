# ============================================================
#  FANZA セール自動投稿ツール 設定ファイル
#  編集したら `scripts\selfcheck.bat` で読み込めるか確認してください。
# ============================================================

# 慣らし運用の開始日。開始日から burn_in_days 日間は自動投稿せず、
# 手動投稿用のテキストを output/manual/ に出力します(ドライラン)。
# 開始日 + burn_in_days 日目(初期値では15日目)から自動投稿を始め、そこを週次スケジュールの1週目とします。
start_date: 2026-10-06
burn_in_days: 14

# true にすると、慣らし期間後も投稿せず文面だけ出力します(ドライランモード)。
dry_run: false

timezone: Asia/Tokyo

# ------------------------------------------------------------
# 収集(DMMアフィリエイトAPI ItemList)
# ------------------------------------------------------------
collect:
  # 対象フロア。初期値は videoa(FANZA動画のビデオ)のみ。
  # 素人も対象にする場合は videoc を追加します:  floors: [videoa, videoc]
  # アニメ・同人・漫画は対象外で、指定するとエラーになります。
  floors: [videoa]
  min_discount_rate: 50        # 割引率の下限(%)。これ未満は取得しない
  sorts: [rank, date]          # 走査する並び順(人気順・新着順)
  hits_per_page: 100           # 1回のAPI呼び出しで取得する件数(最大100)
  scan_pages: 5                # 並び順ごとに何ページ走査するか
  max_items: 100               # 1日に候補として保存する最大件数(割引率の高い順)
  request_interval_sec: 1.0    # API呼び出しの間隔
  candidate_max_age_days: 2    # 何日前までに確認できた商品を投稿候補にするか

# ------------------------------------------------------------
# 除外リスト(取得段階で除外)
#  - genres:   ジャンル名と完全一致したら除外
#  - keywords: タイトル・ジャンル・シリーズ・レーベル・メーカー・キャンペーン名に含まれたら除外
#  全角/半角・大文字/小文字の違いは吸収して判定します(例: ＪＫ と jk は同じ扱い)。
#  未成年を連想させる設定は安全側に倒して広めに除外しています。
#  「少女」は「美少女」にも一致するため、該当作品も除外されます(意図的)。
#  除外した商品は logs/excluded/日付.csv に理由付きで記録されます。
# ------------------------------------------------------------
exclude:
  genres:
    - 女子校生
    - 学生服
    - 制服
    - セーラー服
    - ブレザー
    - 体操着・ブルマ
    - スクール水着
    - ミニ系
    - ロリ系
    - 童顔
  keywords:
    - 女子校生
    - 女子高生
    - 女子高
    - 女子中
    - JK
    - JC
    - JS
    - ロリ
    - 少女
    - 幼
    - 童顔
    - あどけな
    - 未成年
    - 未発達
    - 発育
    - 児童
    - 子供
    - 子ども
    - ガキ
    - 小学
    - 中学
    - 高校
    - 学生
    - 学園
    - 生徒
    - 新入生
    - 入学
    - 卒業式
    - 制服
    - セーラー
    - ブレザー
    - スクール水着
    - スク水
    - ブルマ
    - 体操着
    - ランドセル
    - 放課後
    - 部活
    - 修学旅行
    - 保健室
    - 教え子
    - 家庭教師
    - 塾
    - 低身長
  content_ids: []              # 個別に除外したい商品ID
  makers: []                   # 除外したいメーカー名(完全一致)

# ------------------------------------------------------------
# ジャンル分類(上から順に判定し、最初に一致したものを記録)
#  code はパターンIDに使う英字の略号です。最後の項目は「その他」(条件なし)にしてください。
# ------------------------------------------------------------
genre_categories:
  - code: VR
    name: VR
    genres: [VR専用, ハイクオリティVR, 8KVR]
    title_keywords: ["【VR】"]
  - code: SGL
    name: 単体
    genres: [単体作品]
  - code: SER
    name: シリーズ
    has_series: true
  - code: OTH
    name: その他

# ------------------------------------------------------------
# 投稿スケジュール
# ------------------------------------------------------------
schedule:
  # 1日の投稿件数(まとめ投稿を含む)。1週目・2週目・3週目…の順。最後の値を以降も継続します。
  weekly_posts: [6, 8, 12]
  # 慣らし期間中に1日に作る手動投稿用の下書き件数(まとめ投稿を含む)
  burn_in_daily_posts: 6
  # 1日の投稿上限。何があってもこれを超えて投稿しません(まとめ投稿を含む)。
  daily_hard_limit: 12
  # 1日の区切り(時)。0時台の投稿は前日分として扱います。
  ops_day_start_hour: 5
  # 時間帯。end の 25:00 は翌1:00 の意味です。
  # weight は「1時間あたりの投稿されやすさ」。21時以降を多めにしています。
  bands:
    - {code: H12, start: "12:00", end: "15:00", weight: 1.0}
    - {code: H15, start: "15:00", end: "18:00", weight: 1.0}
    - {code: H18, start: "18:00", end: "21:00", weight: 1.5}
    - {code: H21, start: "21:00", end: "25:00", weight: 3.0}
  min_gap_minutes: 30          # 投稿同士の最小間隔(分)
  late_skip_minutes: 60        # 予定時刻からこれ以上遅れた枠は投稿せずスキップ(PCが起動していなかった等)
  max_posts_per_tick: 1        # 1回の起動で処理する最大件数(スリープ復帰直後の連投防止)

# ------------------------------------------------------------
# まとめ投稿(1日1件。日曜日は週間TOP5)
# ------------------------------------------------------------
summary:
  enabled: true
  top_n: 5
  min_items: 3                 # 候補がこれ未満ならまとめ投稿を作らず個別投稿にする
  window: ["21:00", "23:00"]   # まとめ投稿を置く時間帯
  weekly_weekday: 6            # 週間TOP5にする曜日(0=月曜 … 6=日曜)
  label_max_chars: 12          # 作品ごとの短いラベルの最大文字数
  verify_max_checks: 15        # 投稿直前の価格再確認で最大何件まで確認するか
  # まとめ投稿の形式。キーがパターンIDに使われます。
  formats:
    SA: ランキング形式
    SB: 価格一覧形式

# ------------------------------------------------------------
# 文面生成(Anthropic API)
# ------------------------------------------------------------
generation:
  model: claude-haiku-4-5
  max_tokens: 600
  target_length: 100           # 目安の文字数(本文。#PR を除く)
  min_length: 70
  max_length: 120
  max_retries: 2               # 検証に落ちたときの再生成回数
  pr_suffix: "\n#PR"           # 本文の末尾に必ず付ける文字列
  # 文面のトーン(3種類)。キーがパターンIDに使われます。
  tones:
    TA:
      name: 事実簡潔
      instruction: 価格・割引率・発売日を中心に、落ち着いた告知調で簡潔に書く。感嘆符は使わない。
    TB:
      name: お得感
      instruction: 通常価格との差や割引の大きさが伝わるように、前向きで明るい調子で書く。感嘆符は1つまで。誇張や断定的な煽りはしない。
    TC:
      name: 作品紹介
      instruction: 出演者やジャンルから作品の方向性を穏当な言葉で一言紹介し、続けて価格と割引率を添える。
  # 生成文に含まれていたら不採用にする語(露骨な表現)。除外リストの keywords も併せてチェックします。
  ng_words:
    - セックス
    - sex
    - エッチ
    - えっち
    - エロ
    - 中出し
    - 生中
    - フェラ
    - クンニ
    - 手コキ
    - パイズリ
    - 挿入
    - ピストン
    - 射精
    - ザーメン
    - 精子
    - 絶頂
    - 潮吹
    - イキ
    - イク
    - 喘
    - 淫
    - 痴漢
    - 痴女
    - レイプ
    - 犯
    - 凌辱
    - 陵辱
    - 調教
    - 寝取
    - ntr
    - 乱交
    - 3p
    - 4p
    - 童貞
    - 処女
    - おっぱい
    - 乳首
    - 巨乳
    - 爆乳
    - 美乳
    - 貧乳
    - 尻
    - アナル
    - オナニー
    - 勃起
    - ちんぽ
    - チンポ
    - まんこ
    - マンコ
    - 肉棒
    - 性交
    - 交尾
    - 変態
    - 抜ける
    - 抜き
    - ヌキ
    - 汁
    - 濡れ
    - 裸
    - ヌード

# ------------------------------------------------------------
# 計測用アフィリエイトID
#  文面スタイル(トーン TA/TB/TC、まとめ形式 SA/SB)ごとに別のアフィリエイトIDを使い、
#  DMMのレポートでIDごとのクリック数を見て比較します。
#  値は末尾の番号(990〜999)か、"yourname-991" のような完全なIDで指定します。
#  番号だけの場合は .env の DMM_AFFILIATE_ID の末尾を置き換えて使います。
#  収集用ID(.env の DMM_AFFILIATE_ID)とは別の番号にしてください。
# ------------------------------------------------------------
tracking:
  affiliate_ids:
    TA: 991
    TB: 992
    TC: 993
    SA: 994
    SB: 995

# ------------------------------------------------------------
# 投稿(Playwright。ログイン状態を保存したブラウザプロファイルを使用)
# ------------------------------------------------------------
post:
  browser_channel: msedge      # Windows 11 標準のEdge。chrome / chromium も指定可
  profile_dir: profile         # ログイン状態を保存するフォルダ
  x_handle: ""                 # 投稿するアカウントの @なしユーザー名。設定すると別アカウントでの投稿を防げます
  attach_image: true           # APIが返すパッケージ画像を添付する
  reply_template: "{url}\n#PR"           # 自分の投稿へのリプライ(個別投稿)
  summary_reply_line: "{rank}位 {url}"    # まとめ投稿のリプライの1行
  summary_reply_footer: "#PR"
  reply_delay_sec: [20, 60]    # 本文投稿からリプライまでの待ち時間
  action_delay_sec: [1.0, 3.0] # 画面操作の間の待ち時間
  timeout_sec: 60
  screenshot_on_error: true    # 失敗・検知時に logs/screenshots/ へ画面を保存

# ------------------------------------------------------------
# 安全装置
# ------------------------------------------------------------
safety:
  max_consecutive_failures: 3  # 連続でこの回数失敗したら停止
  verify_before_post: true     # 投稿直前にAPIで価格・割引率を再確認する
  max_replacements: 3          # 再確認でセール終了だった場合に差し替える最大回数

# ------------------------------------------------------------
# 保存先(相対パスはこのファイルがあるフォルダが基準)
# ------------------------------------------------------------
paths:
  data_dir: data
  log_dir: logs
  output_dir: output
  report_dir: reports

# ------------------------------------------------------------
# 計測と撤退
# ------------------------------------------------------------
analytics:
  clicks_by_id_csv: data/clicks_by_id.csv       # 手入力: 日付, アフィリエイトID, クリック数, 成果数
  clicks_by_item_csv: data/clicks_by_item.csv   # 手入力(任意): 日付, 商品ID, クリック数, 成果数
  review_weeks: 2              # 無効化候補の判定に使う直近の週数
  review_min_posts: 10         # この投稿数に満たないパターンは判定しない
  review_threshold_ratio: 0.8  # 同じ区分の平均の80%未満なら無効化候補
  exit_week: 8                 # この週の時点で撤退判定をする
  exit_min_slope: 0.0          # 1投稿あたりクリック数の週次の傾きがこれ以下なら停止を提案
