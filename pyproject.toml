[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanza-poster"
version = "0.1.0"
description = "DMMアフィリエイトAPIで取得したFANZA動画のセール情報をXへ投稿する自動投稿ツール"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11,<2",
    "pydantic>=2.7,<3",
    "PyYAML>=6",
    "python-dotenv>=1",
    "requests>=2.31",
    "playwright>=1.45",
    "tzdata",
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fanza-poster = "fanza_poster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
